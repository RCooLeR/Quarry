name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact commit
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      expected_commit: ${{ github.sha }}
