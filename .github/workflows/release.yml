name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Build
        run: wails3 task windows:build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Compress-Archive -Path bin/quarry.exe -DestinationPath release-artifacts/quarry_windows_amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Build universal app
        run: wails3 task darwin:package:universal

      - name: Package
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent bin/quarry.app release-artifacts/quarry_darwin_universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libc6-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Build
        run: wails3 task linux:build

      - name: Package
        run: |
          mkdir -p release-artifacts/quarry-linux-amd64
          cp bin/quarry release-artifacts/quarry-linux-amd64/
          cp build/linux/quarry.desktop release-artifacts/quarry-linux-amd64/
          cp build/appicon.png release-artifacts/quarry-linux-amd64/
          tar -czf release-artifacts/quarry_linux_amd64.tar.gz -C release-artifacts quarry-linux-amd64
          rm -rf release-artifacts/quarry-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
