version: '3'

tasks:
  verify:go:modules:
    summary: Verifies go.mod and go.sum without rewriting either file
    cmds:
      - go mod tidy -diff

  install:frontend:deps:
    summary: Install the pinned frontend dependency graph with npm
    run: once
    cmds:
      - task: install:frontend:deps:npm

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER=npm)
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates frontend/bindings (-clean deletes it first) while the
    # other's bundler is reading it, failing intermittently with
    # 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: test
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with the pinned npm dependency graph
    dir: frontend
    cmds:
      - npm run {{.SCRIPT}} -q
    vars:
      SCRIPT: "{{.SCRIPT}}"

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from an image; on macOS, `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file (skipped on other platforms).
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:npm

  frontend:dev:npm:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates build assets and reapplies Quarry's platform policy
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
      # Wails beta.15 currently regenerates both Darwin plists with a macOS 12
      # floor. Go 1.27 requires macOS 13, so fail closed unless the generated
      # files contain exactly one minimum-version key and then enforce it.
      - go run ./assetpolicy -macos-minimum "{{.MACOS_MINIMUM}}" darwin/Info.plist darwin/Info.dev.plist
    vars:
      MACOS_MINIMUM: "13.0.0"

  setup:docker:
    summary: Builds the desktop cross-OS image (~800MB download)
    desc: |
      Builds the Docker image used for desktop cross-OS builds.
      Darwin and Windows targets use Zig. Linux targets must match the host/image
      CPU architecture because they link native GTK/WebKit libraries with GCC.
    cmds:
      - docker build -t quarry-wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."
