# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quarry

# Wails desktop candidates are built by native GitHub Actions runners so each
# OS uses the platform toolchain it expects. Public GoReleaser publication is
# intentionally disabled until licensing, signing/notarization, authenticated
# provenance, and packaged-app safety gates are complete.
builds:
  - skip: true

release:
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
