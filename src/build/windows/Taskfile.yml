version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: quarry-wails-cross
  OWNERSHIP_FIX_IMAGE: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

tasks:
  build:
    summary: Builds the application for Windows
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}exit 1{{else}}exit 0{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}exit 1{{else}}exit 0{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell -NoProfile -Command "Remove-Item -LiteralPath 'wails_windows_{{.ARCH | default ARCH}}.syso' -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -f "wails_windows_{{.ARCH | default ARCH}}.syso"
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X=github.com/quarry/quarry-wails3/internal/buildinfo.Version={{.APP_VERSION | default "0.0.0-dev"}} -X=github.com/quarry/quarry-wails3/internal/buildinfo.Commit={{.BUILD_COMMIT | default "unknown"}} -X=github.com/quarry/quarry-wails3/internal/buildinfo.BuildDate={{.BUILD_DATE | default "unknown"}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}false{{else}}true{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.DOCKER_ARCH}}'
      - docker run --rm -v "{{.REPO_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" -e APP_VERSION="{{.APP_VERSION | default "0.0.0-dev"}}" -e BUILD_COMMIT="{{.BUILD_COMMIT | default "unknown"}}" -e BUILD_DATE="{{.BUILD_DATE | default "unknown"}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.REPO_DIR}}:/app" "{{.OWNERSHIP_FIX_IMAGE}}" chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f "wails_windows_{{.DOCKER_ARCH}}.syso"
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # The module is /app/src, not the /app assumed by Wails' docker-mounts
      # helper. Repository-local replacements are already in the /app mount;
      # external replacements can be added with a DOCKER_MOUNTS CLI override.
      DOCKER_MOUNTS: '-v "quarry-go-mod-cache:/go/pkg/mod"'

  package:
    summary: Builds a local unsigned, unqualified NSIS package for validation
    cmds:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  package:candidate:
    summary: Builds an unsigned, unqualified Windows 10/11 x64 NSIS validation candidate
    desc: |
      This task is intentionally narrower than the general packaging scaffold:
      amd64 only, machine-wide install only, and release metadata is mandatory.
      Its output is CI evidence, not a supported or publishable Quarry release.
    platforms: [windows]
    preconditions:
      - sh: '[ -n "{{.APP_VERSION}}" ] && [ "{{.APP_VERSION}}" != "0.0.0-dev" ]'
        msg: "APP_VERSION must be supplied from verified release-candidate provenance"
      - sh: '[ -n "{{.PLATFORM_VERSION}}" ] && [ "{{.PLATFORM_VERSION}}" != "0.0.0" ]'
        msg: "PLATFORM_VERSION must be supplied from verified release-candidate provenance"
      - sh: '[ -n "{{.BUILD_NUMBER}}" ] && [ "{{.BUILD_NUMBER}}" != "0" ]'
        msg: "BUILD_NUMBER must be supplied from verified release-candidate provenance"
    cmds:
      - task: create:nsis:installer
        vars:
          ARCH: amd64
          INSTALL_SCOPE: machine

  generate:syso:
    summary: Generates an ignored Windows resource from tracked templates
    internal: true
    cmds:
      - go run ./build/releasemeta -version '{{.APP_VERSION | default "0.0.0-dev"}}'{{if .BUILD_NUMBER}} -build-number '{{.BUILD_NUMBER}}'{{end}} -windows-template build/windows/info.json -windows-out .task/windows-info-{{.ARCH}}.json -windows-manifest-template build/windows/wails.exe.manifest -windows-manifest-out .task/windows-manifest-{{.ARCH}}.xml
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest .task/windows-manifest-{{.ARCH}}.xml -info .task/windows-info-{{.ARCH}}.json -out wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
    cmds:
      # Generate the online WebView2 bootstrapper, then reject it before
      # embedding unless Windows validates Microsoft's Authenticode signature.
      - wails3 generate webview2bootstrapper -dir "{{.SOURCE_DIR}}/build/windows/nsis"
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "{{.SOURCE_DIR}}/build/windows/verify-webview2-bootstrapper.ps1" -Path "{{.SOURCE_DIR}}/build/windows/nsis/MicrosoftEdgeWebview2Setup.exe"
        platforms: [windows]
      - cmd: echo "Windows NSIS construction is Windows-native only because the WebView2 bootstrapper must pass Windows Authenticode validation." >&2; exit 1
        platforms: [linux, darwin]
      - |
        {{if eq OS "windows"}}
        makensis -DINFO_PRODUCTVERSION="{{.APP_VERSION | default "0.0.0-dev"}}" -DINFO_NUMERICVERSION="{{.PLATFORM_VERSION | default "0.0.0"}}" -DINFO_BUILDNUMBER="{{.BUILD_NUMBER | default "0"}}" {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.SOURCE_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DINFO_PRODUCTVERSION="{{.APP_VERSION | default "0.0.0-dev"}}" -DINFO_NUMERICVERSION="{{.PLATFORM_VERSION | default "0.0.0"}}" -DINFO_BUILDNUMBER="{{.BUILD_NUMBER | default "0"}}" {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.SOURCE_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq (.ARCH | default ARCH) "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"

  sign:installer:
    summary: Disabled until the Windows payload-first signing pipeline is qualified
    desc: |
      This task is intentionally fail-closed. Signing only the outer installer
      after NSIS embeds an unsigned application leaves the installed payload
      unsigned and is not a valid release-signing sequence.
    cmds:
      - echo "sign:installer is disabled. A release-qualified pipeline must sign the application payload first, rebuild NSIS with signed payload and uninstaller finalization, and only then sign the outer installer."; exit 1
