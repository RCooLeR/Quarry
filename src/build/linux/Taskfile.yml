version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for same-architecture cross-OS builds (used on non-Linux hosts
  # or when a native Linux C compiler is unavailable).
  CROSS_IMAGE: quarry-wails-cross
  OWNERSHIP_FIX_IMAGE: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

tasks:
  build:
    summary: Builds the application for Linux
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}exit 1{{else}}exit 0{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
    cmds:
      # Linux links native GTK/WebKit libraries through CGO. The cross image
      # contains libraries and GCC for its own CPU architecture only, so reject
      # a different target before frontend generation or Docker work begins.
      - |
        if [ "{{.TARGET_ARCH}}" != "{{.HOST_ARCH}}" ]; then
          echo "Linux cross-architecture builds are disabled: target {{.TARGET_ARCH}} does not match host {{.HOST_ARCH}}." >&2
          echo "Run linux:build on a {{.TARGET_ARCH}} host/runner with matching native GTK/WebKit libraries and GCC." >&2
          exit 1
        fi
      # Linux requires CGO. Use Docker only when crossing from another OS or
      # when the same-architecture Linux host has no C compiler.
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.TARGET_ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Determine target architecture (defaults to host ARCH if not specified)
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      HOST_ARCH: '{{ARCH}}'
      # Check if a C compiler is available (gcc or clang) — cross-platform via wails3 tool
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}exit 1{{else}}exit 0{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X=github.com/quarry/quarry-wails3/internal/buildinfo.Version={{.APP_VERSION | default "0.0.0-dev"}} -X=github.com/quarry/quarry-wails3/internal/buildinfo.Commit={{.BUILD_COMMIT | default "unknown"}} -X=github.com/quarry/quarry-wails3/internal/buildinfo.BuildDate={{.BUILD_DATE | default "unknown"}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Builds same-architecture Linux using Docker (for non-Linux hosts or when no C compiler is available)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}false{{else}}true{{end}}'
        msg: "Obfuscated builds are temporarily unavailable: Garble v0.18.0 has not completed Quarry obfuscation qualification."
      - sh: '[ "{{.DOCKER_ARCH}}" = "{{.HOST_ARCH}}" ]'
        msg: "Linux Docker builds require target architecture {{.DOCKER_ARCH}} to match host architecture {{.HOST_ARCH}} because the image uses native GCC and GTK/WebKit libraries."
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for this same-architecture Linux build. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
      - sh: 'test "$(docker image inspect --format="{{"{{"}}.Architecture{{"}}"}}" "{{.CROSS_IMAGE}}")" = "{{.DOCKER_ARCH}}"'
        msg: "Linux Docker builds require image '{{.CROSS_IMAGE}}' itself to use architecture {{.DOCKER_ARCH}}; rebuild it on this host with: wails3 task setup:docker"
    cmds:
      - docker run --rm -v "{{.REPO_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" -e APP_VERSION="{{.APP_VERSION | default "0.0.0-dev"}}" -e BUILD_COMMIT="{{.BUILD_COMMIT | default "unknown"}}" -e BUILD_DATE="{{.BUILD_DATE | default "unknown"}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.REPO_DIR}}:/app" "{{.OWNERSHIP_FIX_IMAGE}}" chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{.ARCH | default ARCH}}'
      HOST_ARCH: '{{ARCH}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Repository-relative replacements resolve under /app/src. Add mounts
      # for external replacements with a DOCKER_MOUNTS CLI override if needed.
      DOCKER_MOUNTS: '-v "quarry-go-mod-cache:/go/pkg/mod"'

  package:
    summary: Disabled until Linux distribution provenance and qualification exist
    cmds:
      - task: unsupported:distribution

  create:appimage:
    summary: Disabled until the AppImage toolchain is pinned and qualified
    cmds:
      - task: unsupported:distribution

  create:deb:
    summary: Disabled until Debian packaging is qualified
    cmds:
      - task: unsupported:distribution

  create:rpm:
    summary: Disabled until RPM packaging is qualified
    cmds:
      - task: unsupported:distribution

  create:aur:
    summary: Disabled until Arch Linux packaging is qualified
    cmds:
      - task: unsupported:distribution

  generate:deb:
    summary: Disabled internal Debian-package entry point
    cmds:
      - task: unsupported:distribution

  generate:rpm:
    summary: Disabled internal RPM-package entry point
    cmds:
      - task: unsupported:distribution

  generate:aur:
    summary: Disabled internal Arch-package entry point
    cmds:
      - task: unsupported:distribution

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    summary: Disabled until Debian signing and provenance are qualified
    cmds:
      - task: unsupported:distribution

  sign:rpm:
    summary: Disabled until RPM signing and provenance are qualified
    cmds:
      - task: unsupported:distribution

  sign:packages:
    summary: Disabled until Linux package signing and provenance are qualified
    cmds:
      - task: unsupported:distribution

  unsupported:distribution:
    internal: true
    summary: Reject unqualified Linux package and signing work
    cmds:
      - |
        echo "Linux package/signing tasks are disabled; the raw linux:build task remains available for local validation."
        echo "Re-enable distribution only after the package toolchain is pinned by immutable digest, an approved project license and signing/provenance policy exist, and clean-machine install/upgrade/uninstall qualification passes."
        exit 1
